<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Valet Parking - Control Hotel</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        header {
            background-color: var(--card-bg);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 { font-size: 1.05rem; }

        .btn-config {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .tab-content {
            display: none;
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tab-content.active { display: block; }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .live-clock {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .form-group { margin-bottom: 14px; }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        /* Grilla de 6 fotos (3x2) */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .photo-slot {
            aspect-ratio: 1;
            background-color: var(--bg-color);
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .photo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-slot span {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: center;
            padding: 4px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-confirm {
            background-color: var(--accent-green);
            color: #052e16;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .btn-salida {
            width: 100%;
            background-color: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid var(--primary-red);
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Mapa de Cocheras */
        .cocheras-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 10px;
        }

        .cochera-box {
            padding: 8px 4px;
            text-align: center;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .cochera-libre {
            background-color: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border-color: rgba(34, 197, 94, 0.4);
        }

        .cochera-ocupada {
            background-color: rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            border-color: var(--primary-red);
            cursor: not-allowed;
        }

        .car-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: bold;
        }

        .badge-pendiente { background-color: var(--accent-amber); color: #000; }
        .badge-estacionado { background-color: var(--accent-green); color: #000; }

        /* Cámara Modal */
        #cameraModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 1000;
            flex-direction: column;
        }

        #videoPreview {
            width: 100%;
            height: 80%;
            object-fit: cover;
        }

        .camera-controls {
            height: 20%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #0f172a;
        }

        .btn-capture {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 4px solid white;
            background: var(--primary-red);
        }

        /* Navegación Inferior */
        nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            gap: 4px;
            cursor: pointer;
            width: 33%;
            position: relative;
        }

        .nav-item.active { color: var(--accent-blue); font-weight: bold; }

        .notif-dot {
            position: absolute;
            top: -2px;
            right: 28%;
            background: var(--accent-amber);
            color: #000;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏨 Valet Parking</h1>
        <button class="btn-config" onclick="configurarWebhook()">⚙️ API Sheet</button>
    </header>

    <!-- PESTAÑA 1: INGRESO RÁPIDO (VIGILADOR) -->
    <main id="tab-ingreso" class="tab-content active">
        <div class="live-clock" id="relojVivo">Cargando fecha y hora...</div>

        <form id="formIngreso" class="card" onsubmit="pasarAPendientes(event)">
            <div class="form-group">
                <label>1. FOTOS DEL VEHÍCULO (Hasta 6)</label>
                <div class="photo-grid">
                    <div class="photo-slot" onclick="abrirCamara(0)" id="slot-0"><span>📷 Foto 1<br>Frente</span></div>
                    <div class="photo-slot" onclick="abrirCamara(1)" id="slot-1"><span>📷 Foto 2<br>Lat. Izq</span></div>
                    <div class="photo-slot" onclick="abrirCamara(2)" id="slot-2"><span>📷 Foto 3<br>Lat. Der</span></div>
                    <div class="photo-slot" onclick="abrirCamara(3)" id="slot-3"><span>📷 Foto 4<br>Atrás</span></div>
                    <div class="photo-slot" onclick="abrirCamara(4)" id="slot-4"><span>📷 Foto 5<br>Detalle</span></div>
                    <div class="photo-slot" onclick="abrirCamara(5)" id="slot-5"><span>📷 Foto 6<br>Detalle</span></div>
                </div>
            </div>

            <div class="form-group">
                <label>2. PATENTE</label>
                <input type="text" id="inputPatente" class="form-control" placeholder="Ej: AB 123 CD" required style="text-transform: uppercase; font-weight: bold; letter-spacing: 1px;">
            </div>

            <div class="form-group">
                <label>3. COLOR Y MARCA / MODELO</label>
                <input type="text" id="inputVehiculo" class="form-control" placeholder="Ej: Gris - Toyota Corolla" required>
            </div>

            <div class="form-group">
                <label>4. QUIÉN CONDUCE (Valet Parking)</label>
                <input type="text" id="inputChofer" class="form-control" placeholder="Apellido y Nombre" required>
            </div>

            <button type="submit" class="btn-submit">⏳ ENVIAR A PENDIENTES</button>
        </form>
    </main>

    <!-- PESTAÑA 2: PENDIENTES Y ASIGNACIÓN DE COCHERA -->
    <main id="tab-pendientes" class="tab-content">
        <h2 style="font-size: 0.9rem; margin-bottom: 12px; color: var(--accent-amber);">AUTOS EN MOVIMIENTO (Esperando Cochera)</h2>
        <div id="listaPendientes"></div>

        <div class="card" style="margin-top: 20px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <label style="font-size:0.8rem; font-weight:bold; color:var(--text-muted);">ESTADO DE COCHERAS</label>
                <button type="button" onclick="cambiarTotalCocheras()" style="background:none; border:none; color:var(--accent-blue); font-size:0.75rem; cursor:pointer;">Editar cantidad</button>
            </div>
            <p style="font-size: 0.72rem; color: var(--text-muted); margin-top: 4px;">Verde: Libre | Rojo: Ocupada (Tocá una libre para copiar el N°)</p>
            <div class="cocheras-grid" id="mapaCocheras"></div>
        </div>
    </main>

    <!-- PESTAÑA 3: ADENTRO / BUSCADOR Y SALIDA -->
    <main id="tab-adentro" class="tab-content">
        <div class="card">
            <div class="form-group" style="margin-bottom:0;">
                <label>🔍 BUSCAR AUTO ADENTRO</label>
                <input type="text" id="buscarInput" class="form-control" placeholder="Buscar por patente, cochera o modelo..." onkeyup="renderizarAdentro()">
            </div>
        </div>
        <div id="listaAdentro"></div>
    </main>

    <!-- MODAL CÁMARA -->
    <div id="cameraModal">
        <video id="videoPreview" autoplay playsinline></video>
        <div class="camera-controls">
            <button type="button" style="color:white; background:none; border:none; font-size:1rem;" onclick="cerrarCamara()">Cancelar</button>
            <button type="button" class="btn-capture" onclick="capturarFoto()"></button>
            <div style="width: 60px;"></div>
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <nav>
        <button class="nav-item active" onclick="cambiarTab('ingreso', this)">
            ➕ <span>Ingreso</span>
        </button>
        <button class="nav-item" onclick="cambiarTab('pendientes', this)">
            ⏳ <span>Pendientes</span>
            <span class="notif-dot" id="badgePendientes" style="display:none;">0</span>
        </button>
        <button class="nav-item" onclick="cambiarTab('adentro', this)">
            🚘 <span>Adentro / Salida</span>
        </button>
    </nav>

    <script>
        let fotosCapturadas = [null, null, null, null, null, null];
        let slotActual = null;
        let streamCamara = null;
        let webhookUrl = localStorage.getItem('webhook_url') || 'https://script.google.com/macros/s/AKfycbzAoBtKJgtBh45V7RxSb-5f0LrEUiEOKQJf_osXUHqtP7-mDGyPeEqUc6_92XjyOBFT/exec';
        let totalCocheras = parseInt(localStorage.getItem('total_cocheras')) || 30;

        // Reloj en tiempo real
        setInterval(() => {
            const ahora = new Date();
            document.getElementById('relojVivo').innerText = `📅 ${ahora.toLocaleDateString('es-AR')}  |  🕒 ${ahora.toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit', second:'2-digit'})}`;
        }, 1000);

        function actualizarContadorPendientes() {
            const pendientes = JSON.parse(localStorage.getItem('autos_pendientes') || '[]');
            const badge = document.getElementById('badgePendientes');
            if (pendientes.length > 0) {
                badge.style.display = 'inline-block';
                badge.innerText = pendientes.length;
            } else {
                badge.style.display = 'none';
            }
        }

        function cambiarTab(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            element.classList.add('active');

            if (tabName === 'pendientes') {
                renderizarPendientes();
                renderizarMapaCocheras();
            }
            if (tabName === 'adentro') {
                renderizarAdentro();
            }
        }

        function configurarWebhook() {
            const url = prompt("Pegá la URL de tu Google Apps Script:", webhookUrl);
            if (url !== null) {
                webhookUrl = url.trim();
                localStorage.setItem('webhook_url', webhookUrl);
                alert("URL guardada.");
            }
        }

        function cambiarTotalCocheras() {
            const num = prompt("¿Cuántas cocheras tiene el hotel en total?", totalCocheras);
            if (num && !isNaN(num)) {
                totalCocheras = parseInt(num);
                localStorage.setItem('total_cocheras', totalCocheras);
                renderizarMapaCocheras();
            }
        }

        // CÁMARA
        async function abrirCamara(index) {
            slotActual = index;
            const modal = document.getElementById('cameraModal');
            const video = document.getElementById('videoPreview');

            try {
                streamCamara = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = streamCamara;
                modal.style.display = 'flex';
            } catch (err) {
                alert("No se pudo abrir la cámara. Verificá los permisos del navegador.");
            }
        }

        function cerrarCamara() {
            if (streamCamara) streamCamara.getTracks().forEach(t => t.stop());
            document.getElementById('cameraModal').style.display = 'none';
        }

        function capturarFoto() {
            const video = document.getElementById('videoPreview');
            const canvas = document.createElement('canvas');
            // Redimensionar ligeramente para que 6 fotos suban rápido al Drive sin trabarse
            const maxWidth = 800;
            const scale = maxWidth / video.videoWidth;
            canvas.width = maxWidth;
            canvas.height = video.videoHeight * scale;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
            fotosCapturadas[slotActual] = dataUrl;
            document.getElementById(`slot-${slotActual}`).innerHTML = `<img src="${dataUrl}">`;
            cerrarCamara();
        }

        // PASO 1: GUARDAR EN PENDIENTES (LIBERA LA PANTALLA PARA EL SIGUIENTE AUTO)
        function pasarAPendientes(e) {
            e.preventDefault();
            const ahora = new Date();

            const nuevoAuto = {
                id: Date.now(),
                fechaIngreso: ahora.toLocaleDateString('es-AR'),
                horaIngreso: ahora.toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit'}),
                patente: document.getElementById('inputPatente').value.toUpperCase().trim(),
                vehiculo: document.getElementById('inputVehiculo').value.trim(),
                chofer: document.getElementById('inputChofer').value.trim(),
                fotos: fotosCapturadas.filter(f => f !== null)
            };

            let pendientes = JSON.parse(localStorage.getItem('autos_pendientes') || '[]');
            pendientes.push(nuevoAuto);
            localStorage.setItem('autos_pendientes', JSON.stringify(pendientes));

            // Resetear formulario al instante para recibir otro auto
            document.getElementById('formIngreso').reset();
            fotosCapturadas = [null, null, null, null, null, null];
            const labels = ['Foto 1<br>Frente', 'Foto 2<br>Lat. Izq', 'Foto 3<br>Lat. Der', 'Foto 4<br>Atrás', 'Foto 5<br>Detalle', 'Foto 6<br>Detalle'];
            for (let i = 0; i < 6; i++) {
                document.getElementById(`slot-${i}`).innerHTML = `<span>📷 ${labels[i]}</span>`;
            }

            actualizarContadorPendientes();
            alert(`✅ Auto ${nuevoAuto.patente} pasado a PENDIENTES. Ya podés cargar otro.`);
        }

        // PASO 2: PENDIENTES Y CONFIRMACIÓN DE COCHERA -> ENVÍA AL GOOGLE SHEET
        function renderizarPendientes() {
            const contenedor = document.getElementById('listaPendientes');
            const pendientes = JSON.parse(localStorage.getItem('autos_pendientes') || '[]');

            if (pendientes.length === 0) {
                contenedor.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted); font-size:0.9rem;">No hay autos esperando cochera en este momento.</div>';
                return;
            }

            contenedor.innerHTML = pendientes.map(auto => `
                <div class="car-item">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                        <h3 style="color:var(--accent-blue); font-size:1.3rem;">${auto.patente}</h3>
                        <span class="badge badge-pendiente">⏳ En movimiento (${auto.horaIngreso})</span>
                    </div>
                    <p style="font-size:0.9rem; font-weight:bold;">${auto.vehiculo}</p>
                    <p style="font-size:0.8rem; color:var(--text-muted);">Chofer: ${auto.chofer} | Fotos: ${auto.fotos.length}</p>
                    
                    <div style="display:flex; gap:8px; margin-top:12px;">
                        <input type="text" id="input-cochera-${auto.id}" class="form-control" placeholder="N° Cochera" style="padding:10px;">
                        <button type="button" id="btn-conf-${auto.id}" onclick="confirmarCochera(${auto.id})" class="btn-confirm">Confirmar</button>
                    </div>
                </div>
            `).join('');
        }

        function seleccionarCocheraMapa(numero) {
            const pendientes = JSON.parse(localStorage.getItem('autos_pendientes') || '[]');
            if (pendientes.length > 0) {
                // Completa automáticamente el input del primer auto pendiente
                const primerInput = document.getElementById(`input-cochera-${pendientes[0].id}`);
                if (primerInput) primerInput.value = numero;
            }
        }

        function renderizarMapaCocheras() {
            const mapa = document.getElementById('mapaCocheras');
            const adentro = JSON.parse(localStorage.getItem('autos_adentro') || '[]');
            const ocupadas = adentro.map(a => a.cochera.toString().toUpperCase());

            let html = '';
            for (let i = 1; i <= totalCocheras; i++) {
                const estaOcupada = ocupadas.includes(i.toString());
                if (estaOcupada) {
                    html += `<div class="cochera-box cochera-ocupada" title="Ocupada">${i}</div>`;
                } else {
                    html += `<div class="cochera-box cochera-libre" onclick="seleccionarCocheraMapa('${i}')">${i}</div>`;
                }
            }
            mapa.innerHTML = html;
        }

        async function confirmarCochera(id) {
            const input = document.getElementById(`input-cochera-${id}`);
            const cochera = input.value.trim().toUpperCase();
            if (!cochera) return alert("Escribí o seleccioná el número de cochera.");

            const btn = document.getElementById(`btn-conf-${id}`);
            btn.disabled = true;
            btn.innerText = "Enviando...";

            let pendientes = JSON.parse(localStorage.getItem('autos_pendientes') || '[]');
            const index = pendientes.findIndex(a => a.id === id);
            if (index === -1) return;

            const autoConfirmado = pendientes[index];
            autoConfirmado.cochera = cochera;
            autoConfirmado.accion = "ingreso";

            // 1. Mandar datos + fotos al Google Sheet
            if (webhookUrl) {
                try {
                    await fetch(webhookUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(autoConfirmado)
                    });
                } catch (err) {
                    console.error("Error al enviar a Sheet:", err);
                }
            }

            // 2. Mover de Pendientes a Adentro (sin guardar las fotos pesadas en el localStorage de adentro para no llenar la memoria)
            pendientes.splice(index, 1);
            localStorage.setItem('autos_pendientes', JSON.stringify(pendientes));

            let adentro = JSON.parse(localStorage.getItem('autos_adentro') || '[]');
            const resumenAuto = { ...autoConfirmado, fotos: [] }; // Las fotos ya están a salvo en Drive
            adentro.unshift(resumenAuto);
            localStorage.setItem('autos_adentro', JSON.stringify(adentro));

            actualizarContadorPendientes();
            renderizarPendientes();
            renderizarMapaCocheras();
            alert(`🚀 Cochera ${cochera} confirmada y subida a Google Sheets.`);
        }

        // PASO 3: AUTOS ADENTRO, BUSCADOR Y SALIDA (LIBERA COCHERA)
        function renderizarAdentro() {
            const query = document.getElementById('buscarInput').value.toUpperCase().trim();
            const contenedor = document.getElementById('listaAdentro');
            const adentro = JSON.parse(localStorage.getItem('autos_adentro') || '[]');

            const filtrados = adentro.filter(a => 
                a.patente.includes(query) || 
                a.cochera.includes(query) || 
                a.vehiculo.toUpperCase().includes(query)
            );

            if (filtrados.length === 0) {
                contenedor.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted); font-size:0.9rem;">No se encontraron vehículos estacionados.</div>';
                return;
            }

            contenedor.innerHTML = filtrados.map(auto => `
                <div class="car-item">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                        <h3 style="font-size:1.3rem;">${auto.patente}</h3>
                        <span class="badge badge-estacionado">📍 COCHERA ${auto.cochera}</span>
                    </div>
                    <p style="font-size:0.95rem; font-weight:bold; color:var(--text-main);">${auto.vehiculo}</p>
                    <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">Entró: ${auto.fechaIngreso} a las ${auto.horaIngreso}</p>
                    <p style="font-size:0.8rem; color:var(--text-muted);">Estacionó: ${auto.chofer}</p>
                    
                    <button type="button" onclick="darDeBaja(${auto.id})" class="btn-salida">🚗 Registrar Salida / Liberar Cochera</button>
                </div>
            `).join('');
        }

        async function darDeBaja(id) {
            let adentro = JSON.parse(localStorage.getItem('autos_adentro') || '[]');
            const index = adentro.findIndex(a => a.id === id);
            if (index === -1) return;

            const auto = adentro[index];
            const retiradoPor = prompt(`Salida del vehículo ${auto.patente} (Cochera ${auto.cochera}).\n¿Quién lo retira? (Huésped / Chofer):`);
            
            if (!retiradoPor || retiradoPor.trim() === "") return;

            const ahora = new Date();
            const fechaSalida = `${ahora.toLocaleDateString('es-AR')} ${ahora.toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit'})}`;

            // Avisar al Google Sheet para que marque la salida en la fila correspondiente
            if (webhookUrl) {
                try {
                    await fetch(webhookUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            accion: "salida",
                            id: auto.id,
                            fechaSalida: fechaSalida,
                            retiradoPor: retiradoPor.trim()
                        })
                    });
                } catch (err) {
                    console.error("Error al registrar salida en Sheet:", err);
                }
            }

            // Quitar de Adentro (esto libera automáticamente la cochera en el mapa)
            adentro.splice(index, 1);
            localStorage.setItem('autos_adentro', JSON.stringify(adentro));

            renderizarAdentro();
            alert(`✅ Salida registrada. La cochera ${auto.cochera} volvió a quedar LIBRE.`);
        }

        // Inicializar contador al abrir
        actualizarContadorPendientes();
    </script>
