<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Valet Parking - Control Hotel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🏨 Valet Parking Hotel</h1>
        <div class="header-btns">
            <button class="btn-reset" onclick="reiniciarApp()">🧹 Limpiar Memoria</button>
        </div>
    </header>

    <!-- PESTAÑA 1: INGRESO -->
    <main id="tab-ingreso" class="tab-content active">
        <div class="live-clock" id="relojVivo">Cargando fecha y hora...</div>

        <form id="formIngreso" class="card" onsubmit="guardarIngreso(event)">
            <div class="form-group">
                <label>1. FOTOS DEL ESTADO (Hasta 6)</label>
                <div class="photo-grid">
                    <div class="photo-slot" onclick="abrirCamara(0)" id="slot-0"><span>📷 Frente</span></div>
                    <div class="photo-slot" onclick="abrirCamara(1)" id="slot-1"><span>📷 Lat. Izq</span></div>
                    <div class="photo-slot" onclick="abrirCamara(2)" id="slot-2"><span>📷 Lat. Der</span></div>
                    <div class="photo-slot" onclick="abrirCamara(3)" id="slot-3"><span>📷 Atrás</span></div>
                    <div class="photo-slot" onclick="abrirCamara(4)" id="slot-4"><span>📷 Detalle 1</span></div>
                    <div class="photo-slot" onclick="abrirCamara(5)" id="slot-5"><span>📷 Detalle 2</span></div>
                </div>
            </div>

            <div class="form-group">
                <label>2. MARCA / MODELO</label>
                <input type="text" id="inputMarcaModelo" class="form-control" placeholder="Ej: Toyota Corolla" required>
            </div>

            <div class="form-group">
                <label>3. DOMINIO (Patente)</label>
                <input type="text" id="inputDominio" class="form-control" placeholder="Ej: AB 123 CD" required style="text-transform: uppercase;">
            </div>

            <div class="form-group">
                <label>4. VALET PARKING (Chofer que ingresa)</label>
                <input type="text" id="inputValetEntra" class="form-control" placeholder="Apellido y Nombre" required>
            </div>

            <div class="form-group">
                <label>5. OBSERVACIONES (Opcional)</label>
                <input type="text" id="inputObservaciones" class="form-control" placeholder="Ej: Rayón en paragolpes, Habitación 204">
            </div>

            <button type="submit" class="btn-submit">⏳ ENVIAR A PENDIENTES</button>
        </form>
    </main>

    <!-- PESTAÑA 2: PENDIENTES Y PLANO DE COCHERAS -->
    <main id="tab-pendientes" class="tab-content">
        <h2 class="section-title">AUTOS EN ESPERA DE COCHERA</h2>
        <div id="listaPendientes"></div>

        <div class="card" style="margin-top: 20px;">
            <label style="font-size:0.85rem; font-weight:bold; color:var(--text-main); display:block;">PLANO DE COCHERAS</label>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">Verde: Libre (tocá para asignar) | Rojo: Ocupada</p>
            
            <div class="plano-wrapper">
                <div class="plano-layout" id="planoCocheras"></div>
            </div>
        </div>
    </main>

    <!-- PESTAÑA 3: ADENTRO Y SALIDA -->
    <main id="tab-adentro" class="tab-content">
        <div class="card">
            <div class="form-group" style="margin-bottom:0;">
                <label>🔍 BUSCAR VEHÍCULO ADENTRO</label>
                <input type="text" id="buscarInput" class="form-control" placeholder="Buscar por patente, marca o cochera..." onkeyup="renderizarAdentro()">
            </div>
        </div>
        <div id="listaAdentro"></div>
    </main>

    <!-- MODAL DE CÁMARA -->
    <div id="cameraModal">
        <video id="videoPreview" autoplay playsinline></video>
        <div class="camera-controls">
            <button type="button" style="color:white; background:none; border:none; font-size:1rem;" onclick="cerrarCamara()">Cancelar</button>
            <button type="button" class="btn-capture" onclick="capturarFoto()"></button>
            <div style="width: 60px;"></div>
        </div>
    </div>

    <nav>
        <button class="nav-item active" onclick="cambiarTab('ingreso', this)">
            ➕ <span>Ingreso</span>
        </button>
        <button class="nav-item" onclick="cambiarTab('pendientes', this)">
            ⏳ <span>Pendientes</span>
            <span class="notif-dot" id="badgePendientes" style="display:none;">0</span>
        </button>
        <button class="nav-item" onclick="cambiarTab('adentro', this)">
            🚘 <span>Adentro / Salida</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
